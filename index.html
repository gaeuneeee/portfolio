<script>
const desktop=document.querySelector('.desktop'),folder=document.querySelector('#thumbnails'),dock=document.querySelector('.dock');
const clamp=(n,min,max)=>Math.max(min,Math.min(n,Math.max(min,max)));
const topOffset=()=>desktop.getBoundingClientRect().top;
const dockRestTop=()=>innerHeight-(parseFloat(getComputedStyle(dock).bottom)||0)-dock.offsetHeight;
let depth=10,drag=null;
function bounds(el){return {x:Math.max(0,innerWidth-el.offsetWidth),y:Math.max(0,desktop.clientHeight-el.offsetHeight)}}
function place(el,x,y){const b=bounds(el);el.style.left=clamp(x,0,b.x)+'px';el.style.top=clamp(y,0,b.y)+'px'}
function layoutDock(){
 dock.classList.remove('no-dividers','no-mail','two-rows');
 const available=innerWidth-24;
 if(dock.offsetWidth>available)dock.classList.add('no-dividers');
 if(dock.offsetWidth>available)dock.classList.add('no-mail');
 if(dock.offsetWidth>available)dock.classList.add('two-rows');
 document.documentElement.style.setProperty('--dock-clearance',(dock.offsetHeight+60)+'px');
 const dockBottom=parseFloat(getComputedStyle(dock).bottom)||0;
 document.documentElement.style.setProperty('--dock-mid-bottom',(dockBottom+dock.offsetHeight/2)+'px');
}
function initial(){
 const drive=desktop.querySelector('#drive');if(drive)place(drive,innerWidth<650?innerWidth-drive.offsetWidth-16:.79*(innerWidth-drive.offsetWidth),innerWidth<650?205:.88*Math.max(300,dockRestTop()-topOffset()-16-drive.offsetHeight));
 const note=desktop.querySelector('.note');place(note,innerWidth<1000?18:innerWidth*.02,innerWidth<1000?18:desktop.clientHeight*.04);
 const notice=desktop.querySelector('#notice-note');place(notice,innerWidth<650?innerWidth-notice.offsetWidth-18:innerWidth*.035,innerWidth<650?18:desktop.clientHeight*.30);
 const items=[...desktop.querySelectorAll('.project[data-category]')];
 const available=dockRestTop()-topOffset()-16;
 const mobile=innerWidth<650;
 const rows=Math.ceil(items.length/2);
 const rowHeight=Math.max(48,(available-(innerWidth<650?290:0))/rows);
 const commonWidth=mobile?Math.min(112,(innerWidth-68)/3,Math.max(24,Math.min(72,rowHeight-30))*16/9):112;
 document.documentElement.style.setProperty('--thumb-width',commonWidth+'px');
 items.forEach((el,i)=>{
  el.style.removeProperty('--preview-width');el.style.removeProperty('--folder-width');
  if(mobile){
   const start=290;
   const step=Math.max(48,(available-start)/rows);
   const imageHeight=Math.max(24,Math.min(72,step-30));
   el.style.setProperty('--preview-width',(el.classList.contains('portrait')?imageHeight*.75:Math.min(112,imageHeight*16/9))+'px');
   el.style.setProperty('--folder-width',Math.min(68,imageHeight*90/73)+'px');
   place(el,(innerWidth/2)*(i%2)+(innerWidth/2-el.offsetWidth)/2,start+Math.floor(i/2)*step);
  }else{
   const positions=[[.55,.12],[.76,.23],[.94,.10],[.53,.52],[.83,.59],[.96,.82],[.63,.86],[.72,.50]];
   const [x,y]=positions[i];place(el,x*(innerWidth-el.offsetWidth),y*Math.max(300,available-el.offsetHeight));
  }
 });
}
function draggable(el){
 el.addEventListener('pointerdown',e=>{if(e.button!==0)return;const r=el.getBoundingClientRect();drag={el,id:e.pointerId,x:e.clientX,y:e.clientY,left:r.left,top:r.top,moved:false};el.focus({preventScroll:true});el.setPointerCapture(e.pointerId)});
 el.addEventListener('pointermove',e=>{if(!drag||drag.el!==el||e.pointerId!==drag.id)return;let dx=e.clientX-drag.x,dy=e.clientY-drag.y;if(!drag.moved&&Math.hypot(dx,dy)<5)return;if(!drag.moved){drag.moved=true;el.classList.add('dragging');el.style.zIndex=++depth;if(el.parentElement!==desktop){desktop.append(el);el.style.inset='auto';el.setPointerCapture(e.pointerId)}}place(el,drag.left+dx,drag.top-topOffset()+dy)});
 const end=e=>{if(!drag||drag.el!==el||e.pointerId!==drag.id)return;if(drag.moved)el.dataset.suppressUntil=String(performance.now()+250);el.classList.remove('dragging');drag=null;};
 el.addEventListener('pointerup',end);el.addEventListener('pointercancel',end);
 el.addEventListener('keydown',e=>{if(!['ArrowLeft','ArrowRight','ArrowUp','ArrowDown'].includes(e.key))return;e.preventDefault();const r=el.getBoundingClientRect();if(el.parentElement!==desktop){desktop.append(el);el.style.inset='auto'}const step=e.shiftKey?25:10;place(el,r.left+(e.key==='ArrowRight'?step:e.key==='ArrowLeft'?-step:0),r.top-topOffset()+(e.key==='ArrowDown'?step:e.key==='ArrowUp'?-step:0));el.style.zIndex=++depth;});
}
function suppressClick(el,e){return e.detail!==0&&performance.now()<+(el.dataset.suppressUntil||0)}

// Warp horizontal slices into a continuous funnel aimed at the live Dock icon.
// The copies are visual only; the original dialog keeps its state and scroll position.
function finishProfileMotion(){
 if(profileGenie){cancelAnimationFrame(profileGenie.frame);profileGenie.layer.remove();profileGenie=null}
 profile.style.removeProperty('visibility');profile.style.removeProperty('pointer-events');
 profile.hidden=!profileOpen;profile.inert=!profileOpen;
 updateProfileChrome();
 if(profileOpen){
  revealProfileWorkButton();
 }
 if(profileOpen)profile.querySelector('.launchpad-close').focus({preventScroll:true});
}
function animateProfileGenie(opening){
 const start=profileGenie?profileGenie.progress:opening?1:0;
 if(profileGenie){cancelAnimationFrame(profileGenie.frame);profileGenie.layer.remove()}
 const width=innerWidth,height=innerHeight;
 const dockTranslation=dock.getBoundingClientRect().top-dockRestTop();
 const iconRect=profileButton.getBoundingClientRect();
 const target={left:iconRect.left,top:iconRect.top-dockTranslation,width:iconRect.width,height:iconRect.height};
 const layer=document.createElement('div');layer.className='profile-genie-layer';layer.inert=true;layer.setAttribute('aria-hidden','true');
 const count=32,sliceHeight=height/count,slices=[];
 const scrollTop=profile.scrollTop;
 for(let index=0;index<count;index++){
  const strip=document.createElement('div');strip.className='profile-genie-strip';strip.style.width=width+'px';strip.style.height=(sliceHeight+.5)+'px';
  const copy=profile.cloneNode(true);copy.removeAttribute('id');copy.removeAttribute('role');copy.removeAttribute('aria-labelledby');
  copy.querySelectorAll('[id]').forEach(node=>node.removeAttribute('id'));
  copy.querySelectorAll('iframe').forEach(node=>node.remove());
  copy.classList.add('profile-genie-copy');copy.hidden=false;copy.inert=true;
  Object.assign(copy.style,{visibility:'visible',pointerEvents:'none',position:'absolute',inset:'auto',left:'0',top:(-index*sliceHeight)+'px',width:width+'px',height:height+'px',scrollBehavior:'auto'});
  strip.append(copy);layer.append(strip);slices.push({strip,copy,index});
 }
 document.body.append(layer);slices.forEach(({copy})=>{copy.scrollTop=scrollTop});
 profile.style.visibility='hidden';profile.style.pointerEvents='none';profile.inert=true;
 const smooth=value=>{const n=clamp(value,0,1);return n*n*(3-2*n)};
 const render=progress=>{
  const travel=smooth((progress-.32)/.68);
  const edge=v=>{
   const narrow=smooth((progress-.18*(1-v))/.62);
   const w=width+(target.width-width)*narrow;
   const center=width/2+(target.left+target.width/2-width/2)*narrow;
   return {left:center-w/2,width:w,y:height*v+(target.top+target.height*v-height*v)*travel};
  };
  for(const {strip,index} of slices){
   const top=edge(index/count),bottom=edge((index+1)/count);
   const perspective=(top.width/bottom.width-1)/sliceHeight;
   const factor=1+perspective*sliceHeight;
   const shear=(bottom.left*factor-top.left)/sliceHeight;
   const scaleY=(bottom.y*factor-top.y)/sliceHeight;
   strip.style.transform=`matrix3d(${top.width/width},0,0,0,${shear},${scaleY},0,${perspective},0,0,1,0,${top.left},${top.y},0,1)`;
  }
  layer.style.opacity=String(1-smooth((progress-.88)/.12));
 };
 const destination=opening?0:1;
 const state={layer,frame:0,progress:start};profileGenie=state;updateProfileChrome();render(start);
 const began=performance.now(),duration=Math.max(100,440*Math.abs(destination-start));
 const step=now=>{
  if(profileGenie!==state)return;
  const elapsed=clamp((now-began)/duration,0,1);
  state.progress=start+(destination-start)*smooth(elapsed);render(state.progress);
  if(elapsed<1)state.frame=requestAnimationFrame(step);else finishProfileMotion();
 };
 state.frame=requestAnimationFrame(step);
}
function setProfile(opening,animate=true){
 stopScreenScroll(profile);
 const revision=++profileOpenRevision;
 profileOpen=opening;profile.hidden=false;profileButton.setAttribute('aria-expanded',String(opening));
 if(opening){
  profileWorkButton.style.opacity='0';
  profile.style.scrollBehavior='auto';profile.scrollTo({top:0,left:0,behavior:'instant'});profile.scrollTop=0;
  requestAnimationFrame(()=>{
   if(!profileOpen||revision!==profileOpenRevision)return;
   profile.scrollTo({top:0,left:0,behavior:'instant'});profile.scrollTop=0;profile.style.removeProperty('scroll-behavior');updateScreenScrollCue();
  });
 }
 syncBackdrop(!animate);
 if(!animate||reducedMotion())finishProfileMotion();else animateProfileGenie(opening);
 if(!opening)profileButton.focus({preventScroll:true});
 updateProfileChrome();
}

const reelViewer=document.createElement('dialog');reelViewer.id='reel-viewer';reelViewer.setAttribute('aria-label','대구루루 릴스 재생');
reelViewer.innerHTML='<div class="reel-viewer-bar"><p></p><button type="button" class="reel-viewer-close" aria-label="릴스 닫기" autofocus><img src="assets/icons/close.svg" alt=""></button></div><div class="reel-viewer-film"></div><div class="reel-viewer-links"><a class="reel-viewer-link" target="_blank" rel="noopener noreferrer">YouTube ↗</a><a class="reel-viewer-link reel-instagram-link" target="_blank" rel="noopener noreferrer">Instagram ↗</a></div>';
document.body.append(reelViewer);
let reelViewerOrigin=null,reelViewerAnimation=null;
function closeReel(){
 if(!reelViewer.open)return;
 reelViewer.querySelector('.reel-viewer-film').replaceChildren();reelViewerAnimation?.cancel();
 const animation=reelViewer.animate([{opacity:1},{opacity:0}],{duration:reducedMotion()?0:160,fill:'both'});reelViewerAnimation=animation;
 animation.finished.then(()=>{if(reelViewerAnimation!==animation)return;reelViewer.close();projectScreen.classList.remove('reel-viewing');animation.cancel();reelViewerAnimation=null;reelViewerOrigin?.focus({preventScroll:true})}).catch(()=>{});
}
function openReel(reel,trigger){
 reelViewerOrigin=trigger;stopScreenScroll(projectScreen);projectScreen.classList.add('reel-viewing');
 reelViewer.setAttribute('aria-label',reel.title+' · '+reel.role);reelViewer.querySelector('.reel-viewer-bar p').textContent=reel.title+' · '+reel.role;
 reelViewer.querySelector('.reel-viewer-link').href='https://www.youtube.com/shorts/'+reel.id;
 reelViewer.querySelector('.reel-instagram-link').href=reel.instagram;
 const film=reelViewer.querySelector('.reel-viewer-film');film.replaceChildren();
 if(location.protocol==='file:'){const p=document.createElement('p');p.textContent='아래 YouTube 링크에서 재생해 주세요.';p.style.cssText='padding:20px;font-size:13px;line-height:1.6';film.append(p)}
 else{const frame=document.createElement('iframe');frame.title=reel.title;frame.src='https://www.youtube-nocookie.com/embed/'+reel.id+'?playsinline=1&rel=0&autoplay=1';frame.allow='accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share';frame.allowFullscreen=true;frame.referrerPolicy='strict-origin-when-cross-origin';film.append(frame)}
 reelViewer.showModal();reelViewerAnimation?.cancel();const animation=reelViewer.animate([{opacity:0},{opacity:1}],{duration:reducedMotion()?0:220,fill:'both'});reelViewerAnimation=animation;
 animation.finished.then(()=>{if(reelViewerAnimation===animation){animation.cancel();reelViewerAnimation=null}}).catch(()=>{});
}
reelViewer.querySelector('button').addEventListener('click',closeReel);
reelViewer.addEventListener('cancel',event=>{event.preventDefault();closeReel()});
reelViewer.addEventListener('keydown',event=>event.stopPropagation());
reelViewer.addEventListener('click',event=>{if(event.target===reelViewer)closeReel()});

   <div class="cover-heading-row"><h2 id="project-title"><span>${escape(data.titleLines[0])}</span><strong>${escape(data.titleLines[1])}</strong></h2><div class="cover-tools" aria-label="사용툴">${toolIcons}</div></div>
   <button class="cover-scroll" type="button">스크롤 해주세요<img src="assets/icons/scroll-down.svg" alt="" width="18" height="18"></button>
  </section>
  <section class="project-body" aria-label="작업 소개">
   <div class="project-body-inner">
    <div class="project-description project-intro"><div>${data.role?`<p class="project-role">${escape(data.role)}</p>`:''}<h3>${escape(data.heading)}</h3></div><p class="project-intro-copy">${escape(data.description)}</p></div>
    <div class="project-facts project-facts-layout"><dl class="project-facts-overview"><div><dt>작업연도</dt><dd>${escape(data.year)}</dd></div><div><dt>기여도</dt><dd class="project-contribution"><span class="contribution-dots" aria-hidden="true">${dots}</span><span>${data.contribution}%</span></dd></div></dl><dl class="project-facts-main"><div><dt>사용툴</dt><dd class="project-tool-tags">${toolTags}</dd></div></dl></div>
    <div class="project-film"><iframe title="${escape(data.title)} 전체 영상" data-src="https://www.youtube-nocookie.com/embed/${data.youtube}?playsinline=1&rel=0" loading="lazy" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" allowfullscreen referrerpolicy="strict-origin-when-cross-origin"></iframe></div>
    <div class="project-film-caption"><div class="project-film-links"><a href="https://youtu.be/${data.youtube}" target="_blank" rel="noopener noreferrer">YouTube에서 보기 ↗</a>${data.notePlacement==='film'&&data.note?`<span class="project-film-note">${escape(data.note)}</span>`:''}${data.reference?`<span class="project-reference"><a href="https://youtu.be/${data.reference}" target="_blank" rel="noopener noreferrer">모작한 원본 영상 보기 ↗</a></span>`:''}</div>${data.reference?`<p class="project-film-note">${escape(data.note)}</p>`:''}</div>
    <footer class="project-end${data.reference||!data.note||data.notePlacement==='film'?' project-end-reference':''}">${!data.reference&&data.note&&data.notePlacement!=='film'?`<p>${escape(data.note)}</p>`:''}<button type="button" class="project-back-top">맨 위로 ↑</button></footer>
   </div>
  </section>
 </div>`;
 if(location.protocol==='file:'){
  const film=page.querySelector('.project-film');
  film.replaceChildren();const link=document.createElement('a');link.href='https://youtu.be/'+data.youtube;link.target='_blank';link.rel='noopener noreferrer';link.className='project-film-external';link.textContent='YouTube에서 전체 영상 보기 ↗';film.append(link);
 }
 page.querySelector('.cover-scroll').addEventListener('click',()=>projectScreen.scrollTo({top:page.querySelector('.project-body').offsetTop,behavior:reducedMotion()?'instant':'smooth'}));
 page.querySelector('.project-back-top').addEventListener('click',()=>projectScreen.scrollTo({top:0,behavior:reducedMotion()?'instant':'smooth'}));
}
function startProjectMedia(){
 projectScreen.querySelectorAll('iframe[data-src]').forEach(frame=>{frame.src=frame.dataset.src;delete frame.dataset.src});
 const data=projectPages[projectScreen.dataset.project];
 const background=projectScreen.querySelector('.project-cover-background');
 if(!data?.cover||['cards','detail','reels'].includes(data.coverType)||!background||reducedMotion())return;
 const video=document.createElement('video');video.className='project-cover-video';video.muted=true;video.loop=true;video.playsInline=true;video.preload='auto';video.poster=data.poster;video.setAttribute('aria-hidden','true');
 video.src=data.cover.replace(/\.gif$/,'.mp4');
 video.addEventListener('canplay',()=>{
  if(!projectOpen||!background.isConnected)return;
  background.append(video);
  video.play().then(()=>{if(background.isConnected)video.classList.add('is-playing')}).catch(()=>video.remove());
 },{once:true});
}
// Warm only small cover posters; motion media starts after the entrance transition.
Object.values(projectPages).forEach(data=>{if(data.poster){const poster=new Image();poster.src=data.poster}});
// Native touch remains unchanged; mouse wheels ease toward their requested position.
const screenScrollStops=new WeakMap();
function stopScreenScroll(screen){screenScrollStops.get(screen)?.()}
function installSmoothWheel(screen){
 let frame=0,target=0,lastTime=0;
 const stop=()=>{cancelAnimationFrame(frame);frame=0;target=screen.scrollTop};
 screenScrollStops.set(screen,stop);
 const step=now=>{
  const limit=Math.max(0,screen.scrollHeight-screen.clientHeight);
  target=clamp(target,0,limit);
  const current=screen.scrollTop,distance=target-current;
  const amount=1-Math.exp(-Math.min(40,now-lastTime)/85);lastTime=now;
  if(Math.abs(distance)<=1.5){screen.scrollTo({top:target,behavior:'instant'});frame=0;return}
  const movement=Math.sign(distance)*Math.min(Math.abs(distance),Math.max(1,Math.abs(distance)*amount));
  screen.scrollTo({top:current+movement,behavior:'instant'});
  frame=requestAnimationFrame(step);
 };
 screen.addEventListener('wheel',event=>{
  if(reducedMotion()||event.ctrlKey||event.metaKey||Math.abs(event.deltaX)>Math.abs(event.deltaY)||event.target.closest('input,textarea,select,[contenteditable="true"]'))return;
  const limit=screen.scrollHeight-screen.clientHeight;if(limit<=0)return;
  event.preventDefault();
  const scale=event.deltaMode===1?16:event.deltaMode===2?screen.clientHeight:1;
  target=clamp((frame?target:screen.scrollTop)+event.deltaY*scale,0,limit);
  if(!frame){lastTime=performance.now();frame=requestAnimationFrame(step)}
 },{passive:false});
 ['pointerdown','touchstart','keydown','click'].forEach(type=>screen.addEventListener(type,stop,{capture:true,passive:true}));
}
installSmoothWheel(profile);installSmoothWheel(projectScreen);
projectScreen.querySelector('.launchpad-close').addEventListener('click',()=>closeProjectScreen());
categoryProjects.forEach(trigger=>{
 trigger.setAttribute('aria-haspopup','dialog');trigger.setAttribute('aria-controls',projectScreen.id);
 trigger.removeAttribute('aria-expanded');
 trigger.addEventListener('click',e=>{if(!suppressClick(trigger,e))openProjectScreen(trigger.id,trigger)});
});
document.querySelectorAll('.menu').forEach(menu=>{const trigger=menu.querySelector('button');const set=v=>{menu.classList.toggle('open',v);trigger.setAttribute('aria-expanded',String(v))};menu.addEventListener('mouseenter',()=>set(true));menu.addEventListener('mouseleave',()=>set(false));trigger.addEventListener('click',()=>set(!menu.classList.contains('open')));menu.addEventListener('focusin',()=>trigger.setAttribute('aria-expanded','true'));menu.addEventListener('focusout',e=>{if(!menu.contains(e.relatedTarget))set(false)});menu.querySelectorAll('.dropdown button').forEach(button=>button.addEventListener('click',()=>{set(false);button.blur()}))});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){if(projectOpen){e.preventDefault();closeProjectScreen();return}if(profileOpen){e.preventDefault();closeProfile();return}if(toolsOpen){e.preventDefault();closeTools();return}document.querySelectorAll('.menu').forEach(m=>{m.classList.remove('open');m.querySelector('button').setAttribute('aria-expanded','false')});if(toolsOpen)toggleTools();document.activeElement.blur()}});
document.addEventListener('pointerdown',e=>{if(!e.target.closest('.menu'))document.querySelectorAll('.menu').forEach(m=>{m.classList.remove('open');m.querySelector('button').setAttribute('aria-expanded','false')})});
addEventListener('resize',()=>{layoutDock();initial();if(activeCategory){savedPositions=new Map(categoryProjects.map(el=>[el,{x:el.offsetLeft,y:el.offsetTop}]));alignCategory()}});
layoutDock();initial();
setProfile(true,false);

// Animate actual text nodes; fixed character widths keep glitch substitutions from shifting the layout.
(()=>{
 const motion=matchMedia('(prefers-reduced-motion: reduce)');
 const lines=[...document.querySelectorAll('.wallpaper-line')];
 const symbols='$%*^#&';let timer,phase=0;
 function measure(){
  lines.forEach(line=>{
   line.replaceChildren(...[...line.dataset.word].map(letter=>{const span=document.createElement('span');span.className='wallpaper-letter';span.textContent=letter;return span}));
   [...line.children].forEach(span=>span.style.width=span.getBoundingClientRect().width+'px');
   const context=document.createElement('canvas').getContext('2d');
   if(context){const style=getComputedStyle(line);context.font=style.fontWeight+' '+style.fontSize+' '+style.fontFamily;const ink=context.measureText(line.dataset.word[0]);line.style.marginLeft=ink.actualBoundingBoxLeft+'px'}
  });
 }
 function render(){
  clearTimeout(timer);
  if(motion.matches){lines.forEach(line=>[...line.children].forEach((span,i)=>span.textContent=line.dataset.word[i]));return}
  if(document.hidden){return}
  if(document.body.classList.contains('menu-screen-open')){timer=setTimeout(render,250);return}
  lines.forEach((line,row)=>{
   const word=line.dataset.word;const progress=phase-row*9;
   [...line.children].forEach((span,i)=>{
    let letter=word[i];
    if(progress<word.length*2+2){letter=progress<i*2?' ':progress<i*2+2?symbols[Math.floor(Math.random()*symbols.length)]:letter}
    else if(phase>=65&&phase<69&&(i===(row?4:2)||i===(row?5:3))){letter=symbols[Math.floor(Math.random()*symbols.length)]}
    span.textContent=letter;
   });
  });
  phase=phase>=245?35:phase+1;timer=setTimeout(render,90);
 }
 document.fonts.ready.then(()=>{measure();initial();if(activeCategory){savedPositions=new Map(categoryProjects.map(el=>[el,{x:el.offsetLeft,y:el.offsetTop}]));alignCategory()}render()});
 addEventListener('resize',measure);
 document.addEventListener('visibilitychange',render);
 motion.addEventListener('change',()=>{phase=0;render()});
})();
</script>
